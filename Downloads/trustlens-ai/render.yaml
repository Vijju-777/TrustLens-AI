# Render Blueprint — deploys the FastAPI backend as a Web Service.
# Usage: In Render dashboard -> New -> Blueprint -> point to this repo.
# Render will read this file automatically from the repo root.
services:
  - type: web
    name: trustlens-ai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false        # set manually in Render dashboard (secret)
      - key: MONGODB_URI
        sync: false        # set manually in Render dashboard (secret)
      - key: ALLOWED_ORIGINS
        value: https://your-app.vercel.app   # update after frontend deploy
